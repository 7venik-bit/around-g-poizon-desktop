name: Build and publish Windows release

# Recovery release trigger: product-card click and duplicate-search fix.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve automatic release version
        id: release_version
        shell: pwsh
        run: |
          git fetch --tags --force

          $baseVersionText = node -p "require('./package.json').version"
          $baseVersion = [version]$baseVersionText
          $majorMinorPrefix = "v$($baseVersion.Major).$($baseVersion.Minor).*"
          $latestTag = git tag --list $majorMinorPrefix --sort=-v:refname | Select-Object -First 1

          if ($latestTag) {
            $latestVersionText = ($latestTag -replace '^v', '')
            $latestVersion = [version]$latestVersionText
            $releaseVersion = [version]::new(
              $latestVersion.Major,
              $latestVersion.Minor,
              $latestVersion.Build + 1
            )
          } else {
            $releaseVersion = $baseVersion
          }

          $version = "$($releaseVersion.Major).$($releaseVersion.Minor).$($releaseVersion.Build)"
          npm version $version --no-git-tag-version --allow-same-version
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to set automatic release version $version."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Automatic release version: $version"

      - name: Build Windows installer
        run: npx electron-builder --win nsis --publish never

      - name: Validate and normalize local release assets
        id: assets
        shell: pwsh
        run: |
          $version = "${{ steps.release_version.outputs.version }}"
          $installers = @(Get-ChildItem -Path dist -File -Filter "*.exe")
          $blockmaps = @(Get-ChildItem -Path dist -File -Filter "*.exe.blockmap")
          $latest = Get-Item -Path "dist/latest.yml" -ErrorAction SilentlyContinue

          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)."
          }
          if ($blockmaps.Count -ne 1) {
            throw "Expected exactly one installer blockmap, found $($blockmaps.Count)."
          }
          if ($null -eq $latest) {
            throw "dist/latest.yml was not generated."
          }

          $installerName = "Around-G-POIZON-Setup-$version.exe"
          $blockmapName = "$installerName.blockmap"
          $installerPath = Join-Path $installers[0].DirectoryName $installerName
          $blockmapPath = Join-Path $blockmaps[0].DirectoryName $blockmapName
          $oldInstallerName = $installers[0].Name

          Move-Item -LiteralPath $installers[0].FullName -Destination $installerPath -Force
          Move-Item -LiteralPath $blockmaps[0].FullName -Destination $blockmapPath -Force
          $latestContent = Get-Content -LiteralPath $latest.FullName -Raw
          $latestContent = $latestContent.Replace($oldInstallerName, $installerName)
          Set-Content -LiteralPath $latest.FullName -Value $latestContent -NoNewline -Encoding utf8

          $verifiedLatest = Get-Content -LiteralPath $latest.FullName -Raw
          if ($verifiedLatest -notmatch [regex]::Escape($installerName)) {
            throw "latest.yml does not reference $installerName."
          }
          if ($verifiedLatest -notmatch "version:\s*$([regex]::Escape($version))") {
            throw "latest.yml does not contain version $version."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "installer=$installerPath" >> $env:GITHUB_OUTPUT
          "blockmap=$blockmapPath" >> $env:GITHUB_OUTPUT
          "latest=$($latest.FullName)" >> $env:GITHUB_OUTPUT
          "installer_name=$installerName" >> $env:GITHUB_OUTPUT
          "blockmap_name=$blockmapName" >> $env:GITHUB_OUTPUT

      - name: Create release tag after successful build
        shell: pwsh
        run: |
          $tag = "${{ steps.assets.outputs.tag }}"
          git fetch --tags --force
          git show-ref --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -eq 0) {
            throw "Automatic release tag $tag already exists."
          }
          git tag $tag
          git push origin $tag
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to push release tag $tag."
          }

      - name: Publish recovery release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.assets.outputs.tag }}
          name: ${{ steps.assets.outputs.tag }} recovery
          generate_release_notes: true
          files: |
            ${{ steps.assets.outputs.installer }}
            ${{ steps.assets.outputs.blockmap }}
            ${{ steps.assets.outputs.latest }}

      - name: Verify published recovery assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.assets.outputs.tag }}"
          $requiredNames = @(
            "${{ steps.assets.outputs.installer_name }}"
            "${{ steps.assets.outputs.blockmap_name }}"
            "latest.yml"
          )
          $release = gh release view $tag --repo "$env:GITHUB_REPOSITORY" --json assets | ConvertFrom-Json
          $remoteNames = @($release.assets | ForEach-Object { $_.name })
          foreach ($requiredName in $requiredNames) {
            if ($requiredName -notin $remoteNames) {
              throw "Release asset verification failed: $requiredName is missing."
            }
          }
          Write-Host "Verified recovery release assets: $($remoteNames -join ', ')"

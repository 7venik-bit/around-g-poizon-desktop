name: Build and publish Windows release

on:
  push:
    branches:
      - main
    paths:
      - "main.mjs"
      - "preload.cjs"
      - "src/**"
      - "services/**"
      - "relay/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Ensure release tag exists
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          git fetch --tags --force
          git show-ref --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -eq 0) {
            $tagCommit = git rev-list -n 1 $tag
            $headCommit = git rev-parse HEAD
            if ($tagCommit -ne $headCommit) {
              git diff --quiet $tagCommit $headCommit -- . ':(exclude).github/workflows/release.yml'
              if ($LASTEXITCODE -ne 0) {
                throw "Release tag $tag already points to different application source. Bump package.json before publishing."
              }
              Write-Host "Reusing $tag because only the release workflow changed after the tag was created."
            }
          } else {
            git tag $tag
            git push origin $tag
          }

      - name: Build and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always

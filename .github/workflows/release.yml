name: Build and publish Windows release

# Release trigger: push, manual dispatch, or merged pull request.
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: true

jobs:
  release:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Apply SSG exact-result verdict restore
        run: node scripts/patch-ssg-verdict-restore.mjs

      - name: Verify SSG exact-result verdict
        run: node scripts/verify-ssg-verdict.mjs

      - name: Apply Lotte exact-result verdict restore
        run: node scripts/patch-lotte-verdict-restore.mjs

      - name: Verify Lotte exact-result verdict
        run: node scripts/verify-lotte-verdict.mjs

      - name: Apply SSG and Lotte authenticity guide
        run: node scripts/patch-domestic-authenticity-guide.mjs

      - name: Verify SSG and Lotte authenticity guide
        run: node scripts/verify-domestic-authenticity-guide.mjs

      - name: Apply deferred SSG search
        run: node scripts/patch-defer-ssg-search.mjs

      - name: Verify deferred SSG search
        run: node scripts/verify-defer-ssg-search.mjs

      - name: Apply SSG session reset on access limit
        run: node scripts/patch-ssg-session-reset.mjs

      - name: Verify SSG session reset on access limit
        run: node scripts/verify-ssg-session-reset.mjs

      - name: Apply simplified official and Naver search
        run: node scripts/patch-simplify-official-naver-search.mjs

      - name: Verify simplified official and Naver search
        run: node scripts/verify-simplify-official-naver-search.mjs

      - name: Apply Naver result-link finalizer
        run: node scripts/patch-naver-result-link-finalizer.mjs

      - name: Verify Naver result-link finalizer
        run: node scripts/verify-naver-result-link-finalizer.mjs

      - name: Test Naver result-link integration
        run: node --test tests/naver-fashiontown-result-finalizer.test.mjs

      - name: Apply next-day access cooldown
        run: node scripts/patch-domestic-access-next-day.mjs

      - name: Verify next-day access cooldown
        run: node scripts/verify-domestic-access-next-day.mjs

      - name: Close simplified search windows after result
        run: node scripts/patch-close-domestic-search-windows.mjs

      - name: Verify simplified search-window cleanup
        run: node scripts/verify-close-domestic-search-windows.mjs

      - name: Keep domestic results inside the controlled browser
        run: node scripts/patch-domestic-result-internal-window.mjs

      - name: Verify controlled domestic result window
        run: node scripts/verify-domestic-result-internal-window.mjs

      - name: Restore popular list auto login and capture
        run: node scripts/patch-restore-popular-login-capture.mjs

      - name: Verify popular list auto login and capture
        run: node scripts/verify-restore-popular-login-capture.mjs

      - name: Enable popular list automatic fetch on open
        run: node scripts/patch-popular-auto-fetch-on-open.mjs

      - name: Verify popular list automatic fetch on open
        run: node scripts/verify-popular-auto-fetch-on-open.mjs

      - name: Restore full popular ranking scroll capture
        run: node scripts/patch-popular-full-rank-scroll.mjs

      - name: Verify full popular ranking scroll capture
        run: node scripts/verify-popular-full-rank-scroll.mjs

      - name: Resolve release version
        id: release_version
        shell: pwsh
        run: |
          git fetch --tags --force
          $baseVersionText = node -p "require('./package.json').version"
          $baseVersion = [version]$baseVersionText
          $releaseVersion = $baseVersion
          $prefix = "v$($baseVersion.Major).$($baseVersion.Minor).*"
          $latestTag = git tag --list $prefix --sort=-v:refname | Select-Object -First 1
          if ($latestTag) {
            try {
              $latestVersion = [version]($latestTag -replace '^v', '')
              if ($latestVersion -ge $releaseVersion) {
                $releaseVersion = [version]::new(
                  $latestVersion.Major,
                  $latestVersion.Minor,
                  $latestVersion.Build + 1
                )
              }
            } catch {
              Write-Host "Ignoring non-semver tag: $latestTag"
            }
          }
          $version = "$($releaseVersion.Major).$($releaseVersion.Minor).$($releaseVersion.Build)"
          npm version $version --no-git-tag-version --allow-same-version
          if ($LASTEXITCODE -ne 0) { throw "Failed to set release version $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $version"

      - name: Build Windows installer
        run: npx electron-builder --win nsis --publish never

      - name: Validate and normalize release assets
        id: assets
        shell: pwsh
        run: |
          $version = "${{ steps.release_version.outputs.version }}"
          $installers = @(Get-ChildItem -Path dist -File -Filter "*.exe")
          $blockmaps = @(Get-ChildItem -Path dist -File -Filter "*.exe.blockmap")
          $latest = Get-Item -Path "dist/latest.yml" -ErrorAction SilentlyContinue
          if ($installers.Count -ne 1) { throw "Expected exactly one Windows installer, found $($installers.Count)." }
          if ($blockmaps.Count -ne 1) { throw "Expected exactly one blockmap, found $($blockmaps.Count)." }
          if ($null -eq $latest) { throw "dist/latest.yml was not generated." }

          $installerName = "Around-G-POIZON-Setup-$version.exe"
          $blockmapName = "$installerName.blockmap"
          $installerPath = Join-Path $installers[0].DirectoryName $installerName
          $blockmapPath = Join-Path $blockmaps[0].DirectoryName $blockmapName
          $oldInstallerName = $installers[0].Name

          Move-Item -LiteralPath $installers[0].FullName -Destination $installerPath -Force
          Move-Item -LiteralPath $blockmaps[0].FullName -Destination $blockmapPath -Force
          $latestContent = Get-Content -LiteralPath $latest.FullName -Raw
          $latestContent = $latestContent.Replace($oldInstallerName, $installerName)
          Set-Content -LiteralPath $latest.FullName -Value $latestContent -NoNewline -Encoding utf8

          $verifiedLatest = Get-Content -LiteralPath $latest.FullName -Raw
          if ($verifiedLatest -notmatch [regex]::Escape($installerName)) { throw "latest.yml does not reference $installerName." }
          if ($verifiedLatest -notmatch "version:\s*$([regex]::Escape($version))") { throw "latest.yml does not contain version $version." }

          "installer=$installerPath" >> $env:GITHUB_OUTPUT
          "blockmap=$blockmapPath" >> $env:GITHUB_OUTPUT
          "latest=$($latest.FullName)" >> $env:GITHUB_OUTPUT
          "installer_name=$installerName" >> $env:GITHUB_OUTPUT
          "blockmap_name=$blockmapName" >> $env:GITHUB_OUTPUT

      - name: Create release, tag, and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_version.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.assets.outputs.installer }}
            ${{ steps.assets.outputs.blockmap }}
            ${{ steps.assets.outputs.latest }}

      - name: Verify published release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.release_version.outputs.tag }}"
          $requiredNames = @(
            "${{ steps.assets.outputs.installer_name }}",
            "${{ steps.assets.outputs.blockmap_name }}",
            "latest.yml"
          )
          $release = gh release view $tag --repo "$env:GITHUB_REPOSITORY" --json tagName,targetCommitish,assets | ConvertFrom-Json
          if ($release.tagName -ne $tag) { throw "Release tag verification failed." }
          $remoteNames = @($release.assets | ForEach-Object { $_.name })
          foreach ($requiredName in $requiredNames) {
            if ($requiredName -notin $remoteNames) { throw "Release asset verification failed: $requiredName is missing." }
          }
          Write-Host "Verified $tag assets: $($remoteNames -join ', ')"

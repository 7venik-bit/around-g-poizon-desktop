name: Build and publish Windows release

on:
  push:
    branches:
      - main
    paths:
      - "main.mjs"
      - "preload.cjs"
      - "src/**"
      - "services/**"
      - "relay/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Ensure release tag exists
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          git fetch --tags --force
          git show-ref --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -eq 0) {
            $tagCommit = git rev-list -n 1 $tag
            $headCommit = git rev-parse HEAD
            if ($tagCommit -ne $headCommit) {
              git diff --quiet $tagCommit $headCommit -- . ':(exclude).github/workflows/release.yml'
              if ($LASTEXITCODE -ne 0) {
                throw "Release tag $tag already points to different application source. Bump package.json before publishing."
              }
              Write-Host "Reusing $tag because only the release workflow changed after the tag was created."
            }
          } else {
            git tag $tag
            git push origin $tag
          }

      - name: Build Windows installer
        run: npx electron-builder --win nsis --publish never

      - name: Verify and publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $installers = @(Get-ChildItem -Path dist -File -Filter "*.exe")
          $blockmaps = @(Get-ChildItem -Path dist -File -Filter "*.exe.blockmap")
          $latest = Get-Item -Path "dist/latest.yml" -ErrorAction SilentlyContinue

          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)."
          }
          if ($blockmaps.Count -ne 1) {
            throw "Expected exactly one installer blockmap, found $($blockmaps.Count)."
          }
          if ($null -eq $latest) {
            throw "dist/latest.yml was not generated."
          }

          $installerName = "Around-G-POIZON-Setup-$version.exe"
          $blockmapName = "$installerName.blockmap"
          $installerPath = Join-Path $installers[0].DirectoryName $installerName
          $blockmapPath = Join-Path $blockmaps[0].DirectoryName $blockmapName
          $oldInstallerName = $installers[0].Name

          Move-Item -LiteralPath $installers[0].FullName -Destination $installerPath -Force
          Move-Item -LiteralPath $blockmaps[0].FullName -Destination $blockmapPath -Force
          $latestContent = Get-Content -LiteralPath $latest.FullName -Raw
          $latestContent = $latestContent.Replace($oldInstallerName, $installerName)
          Set-Content -LiteralPath $latest.FullName -Value $latestContent -NoNewline -Encoding utf8

          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "$env:GITHUB_REPOSITORY" --title $tag --generate-notes --verify-tag
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create release $tag."
            }
          }

          $assetPaths = @(
            $installerPath
            $blockmapPath
            $latest.FullName
          )
          $requiredNames = @(
            $installerName
            $blockmapName
            "latest.yml"
          )

          gh release upload $tag $assetPaths --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload release assets for $tag."
          }

          $release = gh release view $tag --repo "$env:GITHUB_REPOSITORY" --json assets | ConvertFrom-Json
          $remoteNames = @($release.assets | ForEach-Object { $_.name })
          $obsoleteNames = @($remoteNames | Where-Object { $_ -notin $requiredNames })
          foreach ($obsoleteName in $obsoleteNames) {
            gh release delete-asset $tag $obsoleteName --repo "$env:GITHUB_REPOSITORY" --yes
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to remove obsolete release asset: $obsoleteName."
            }
          }

          $release = gh release view $tag --repo "$env:GITHUB_REPOSITORY" --json assets | ConvertFrom-Json
          $remoteNames = @($release.assets | ForEach-Object { $_.name })
          foreach ($requiredName in $requiredNames) {
            if ($requiredName -notin $remoteNames) {
              throw "Release asset verification failed: $requiredName is missing."
            }
          }
          if ($remoteNames.Count -ne $requiredNames.Count) {
            throw "Release asset verification failed: expected 3 assets, found $($remoteNames.Count)."
          }
          Write-Host "Verified release assets: $($remoteNames -join ', ')"

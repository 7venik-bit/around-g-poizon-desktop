name: Apply v2.10.52 real brand work fix

on:
  pull_request:
    branches:
      - main
    paths:
      - "hotfix/apply-v2.10.52-start-real-work.py"
      - ".github/workflows/apply-v2.10.52-start-real-work.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Normalize patch structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("hotfix/apply-v2.10.52-start-real-work.py")
          source = path.read_text(encoding="utf-8")

          def dedent_named(text, name):
              pattern = re.compile(rf"({name} = ''')(.*?)(''')", re.S)
              match = pattern.search(text)
              if not match:
                  raise SystemExit(f"{name} block not found")
              body = "\n".join(line[4:] if line.startswith("    ") else line for line in match.group(2).split("\n"))
              return text[:match.start()] + match.group(1) + body + match.group(3) + text[match.end():]

          for block_name in ("old_current", "new_current", "old_message", "new_message", "old_failure", "new_failure"):
              source = dedent_named(source, block_name)

          source = source.replace(
              "'''      let lastReloadAt = 0;\n      let lastProgressAt = 0;'''",
              "'''  let lastReloadAt = 0;\n  let lastProgressAt = 0;'''",
          )
          source = source.replace(
              "'''      let lastReloadAt = 0;\n      let lastProgressAt = 0;\n      let fallbackCandidateJobId = \"\";\n      let fallbackCandidateStableReads = 0;'''",
              "'''  let lastReloadAt = 0;\n  let lastProgressAt = 0;\n  let fallbackCandidateJobId = \"\";\n  let fallbackCandidateStableReads = 0;'''",
          )
          path.write_text(source, encoding="utf-8")
          PY

      - name: Apply source fix
        run: python hotfix/apply-v2.10.52-start-real-work.py

      - name: Install dependencies
        run: npm ci

      - name: Run complete tests
        run: npm test

      - name: Commit verified source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.mjs src/renderer.js package.json package-lock.json tests
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Release v2.10.52 start real brand work"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

name: Apply v2.10.52 real brand work fix

on:
  pull_request:
    branches:
      - main
    paths:
      - "hotfix/apply-v2.10.52-start-real-work.py"
      - ".github/workflows/apply-v2.10.52-start-real-work.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Keep only behavior-critical patch steps
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("hotfix/apply-v2.10.52-start-real-work.py")
          source = path.read_text(encoding="utf-8")
          start = source.find("old_progress = ")
          end = source.find("\n\nold_failure_text =", start)
          if start < 0 or end < 0:
              raise SystemExit("optional progress replacement block not found")
          source = source[:start] + source[end + 2:]
          source = source.replace("새 미사용 작업번호를 연속 확인 중", "새 미사용 작업번호를 확인합니다")
          path.write_text(source, encoding="utf-8")
          PY

      - name: Apply source fix
        run: python hotfix/apply-v2.10.52-start-real-work.py

      - name: Install dependencies
        run: npm ci

      - name: Run complete tests
        run: npm test

      - name: Commit verified source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.mjs src/renderer.js package.json package-lock.json tests
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Release v2.10.52 start real brand work"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

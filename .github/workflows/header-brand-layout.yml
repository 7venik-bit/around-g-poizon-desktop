name: Verify rendered header and brand layout
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/patch-*.mjs'
      - 'scripts/test-header-brand-layout.cjs'
      - 'tests/header-brand-layout.test.mjs'
      - 'package.json'
      - '.github/workflows/header-brand-layout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rendered-layout:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install all release presentation patches
        run: npm ci
      - name: Measure 42 window, scaling, and updating states in Electron
        shell: pwsh
        run: >-
          node -e "const {spawnSync}=require('node:child_process');const env={...process.env};delete env.ELECTRON_RUN_AS_NODE;const r=spawnSync(require('electron'),['scripts/test-header-brand-layout.cjs'],{stdio:'inherit',env,shell:false});if(r.error)throw r.error;process.exit(r.status??1)"
      - name: Require all 42 geometry results to pass
        run: >-
          node -e "const a=require('node:assert/strict');const r=JSON.parse(require('node:fs').readFileSync('layout-artifacts/results.json','utf8'));a.equal(r.total,42);a.equal(r.failed,0);a.ok(r.results.every(x=>x.errors.length===0));a.ok(r.baseline.errors.length>0);console.log('42 rendered cases passed; original defects reproduced.');"
      - name: Save rendered screenshots and geometry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: header-brand-layout-${{ github.sha }}
          path: layout-artifacts/
          retention-days: 14
          if-no-files-found: warn

name: Live retailer program audit (no user credentials)
on:
  push:
    branches: [codex/live-retailer-program-audit]
    paths:
      - scripts/live-retailer-program-audit.mjs
      - scripts/run-live-retailer-audit.cjs
      - scripts/live-retailer-audit-entry.cjs
      - .github/workflows/live-retailer-program-audit.yml
permissions:
  contents: read
concurrency:
  group: live-retailer-program-audit
  cancel-in-progress: true
jobs:
  live:
    runs-on: windows-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        scenario: [naver-jh9976, naver-crocs, official-crocs, lotte-crocs]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply the shipping release transformations in their actual order
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {spawnSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          const workflow=readFileSync('.github/workflows/release.yml','utf8');
          const scripts=[...workflow.matchAll(/^\s+run: node (scripts\/(?:patch|verify)-[a-z0-9-]+\.mjs)\s*$/gm)].map(m=>m[1]);
          assert.ok(scripts.length>20,'Shipping transformation list was not recognized');
          for(const script of scripts){
            const r=spawnSync(process.execPath,[script],{stdio:'inherit'});
            if(r.error)throw r.error;
            assert.equal(r.status,0,script);
          }
          NODE
      - name: Await actual program execution and require product-price evidence
        env:
          AROUNDG_LIVE_CASE: ${{ matrix.scenario }}
          AROUNDG_LIVE_OUTPUT: ${{ runner.temp }}/live-retailer-audit/${{ matrix.scenario }}
          AROUNDG_BASE_COMMIT: d46413855c0a70b6a856bf4f8f1d4a9d800b977d
        run: node scripts/run-live-retailer-audit.cjs
      - name: Preserve observed results even when collection fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-program-${{ matrix.scenario }}
          path: ${{ runner.temp }}/live-retailer-audit/${{ matrix.scenario }}
          retention-days: 7
          if-no-files-found: error

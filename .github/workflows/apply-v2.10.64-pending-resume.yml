name: Apply v2.10.64 pending resume confirmation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-v2.10.64-pending-resume.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply source and test changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          bootstrap_path = Path("bootstrap.mjs")
          bootstrap = bootstrap_path.read_text(encoding="utf-8")
          bootstrap = bootstrap.replace(
              'import { app, ipcMain } from "electron";',
              'import { app, BrowserWindow, dialog, ipcMain } from "electron";',
          )
          marker = 'const [excelColumnLayoutSource, excelColumnLayoutCss, searchServiceMenuSource, searchServiceMenuCss] = await Promise.all(['
          insertion = r'''const nativeIpcHandle = ipcMain.handle.bind(ipcMain);
          let pendingBrandResumeDecision = "unasked";

          ipcMain.handle = (channel, listener) => {
            if (channel !== "brand-export:pending-jobs") return nativeIpcHandle(channel, listener);
            return nativeIpcHandle(channel, async (event, ...args) => {
              const jobs = await listener(event, ...args);
              const pending = Array.isArray(jobs)
                ? jobs.filter((job) => String(job?.jobId || "").trim() && String(job?.brandName || "").trim())
                : [];
              if (!pending.length) return jobs;
              if (pendingBrandResumeDecision === "unasked") {
                const visibleJobs = pending.slice(0, 8).map((job) =>
                  `• ${String(job.brandName).trim()} · 작업번호 ${String(job.jobId).trim()}`
                );
                if (pending.length > visibleJobs.length) {
                  visibleJobs.push(`• 그 외 ${pending.length - visibleJobs.length}개 작업`);
                }
                const options = {
                  type: "question",
                  title: "이전 미다운로드 작업",
                  message: `미다운로드 작업 ${pending.length}개가 있습니다.`,
                  detail: `${visibleJobs.join("\n")}\n\n이전 작업의 다운로드 감시를 다시 시작할까요?\n‘나중에’를 선택하면 이번 실행에서는 재개하지 않아 업데이트를 먼저 설치할 수 있습니다. 미다운로드 작업 기록은 삭제되지 않습니다.`,
                  buttons: ["작업 재개", "나중에"],
                  defaultId: 1,
                  cancelId: 1,
                  noLink: true,
                };
                const parent = BrowserWindow.fromWebContents(event.sender);
                const result = parent
                  ? await dialog.showMessageBox(parent, options)
                  : await dialog.showMessageBox(options);
                pendingBrandResumeDecision = result.response === 0 ? "resume" : "later";
              }
              return pendingBrandResumeDecision === "resume" ? jobs : [];
            });
          };

          '''
          if marker not in bootstrap:
              raise SystemExit("bootstrap insertion marker not found")
          if "pendingBrandResumeDecision" not in bootstrap:
              bootstrap = bootstrap.replace(marker, insertion + marker, 1)
          bootstrap_path.write_text(bootstrap, encoding="utf-8")

          for path_text in ["package.json", "package-lock.json"]:
              path = Path(path_text)
              text = path.read_text(encoding="utf-8").replace("2.10.63", "2.10.64")
              path.write_text(text, encoding="utf-8")

          for path in Path("tests").glob("*.test.mjs"):
              text = path.read_text(encoding="utf-8")
              updated = text.replace("2.10.63", "2.10.64")
              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          test_path = Path("tests/pending-resume-confirmation-v2.10.64.test.mjs")
          test_path.write_text(r'''import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import test from "node:test";

          const [bootstrap, renderer, packageSource, lockSource] = await Promise.all([
            readFile(new URL("../bootstrap.mjs", import.meta.url), "utf8"),
            readFile(new URL("../src/renderer.js", import.meta.url), "utf8"),
            readFile(new URL("../package.json", import.meta.url), "utf8"),
            readFile(new URL("../package-lock.json", import.meta.url), "utf8"),
          ]);

          test("startup asks before restoring unfinished POIZON downloads", () => {
            assert.match(bootstrap, /channel !== "brand-export:pending-jobs"/);
            assert.match(bootstrap, /미다운로드 작업 \$\{pending\.length\}개가 있습니다/);
            assert.match(bootstrap, /buttons: \["작업 재개", "나중에"\]/);
            assert.match(bootstrap, /defaultId: 1/);
            assert.match(bootstrap, /cancelId: 1/);
          });

          test("choosing later preserves jobs but prevents automatic monitor startup", () => {
            assert.match(bootstrap, /pendingBrandResumeDecision === "resume" \? jobs : \[\]/);
            assert.match(bootstrap, /미다운로드 작업 기록은 삭제되지 않습니다/);
            const restore = renderer.match(/async function restorePendingBrandExportJobs[\s\S]*?\n}/)?.[0] || "";
            assert.match(restore, /if \(!pending\.length\) return/);
            assert.match(restore, /await window\.aroundG\.startSellerBrandExportMonitor\(\)/);
          });

          test("release metadata is 2.10.64", () => {
            assert.equal(JSON.parse(packageSource).version, "2.10.64");
            assert.equal(JSON.parse(lockSource).version, "2.10.64");
            assert.equal(JSON.parse(lockSource).packages[""].version, "2.10.64");
          });
          ''', encoding="utf-8")

          Path(".github/workflows/apply-v2.10.64-pending-resume.yml").unlink()
          PY

      - name: Commit generated patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v2.10.64 confirm pending job resume"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

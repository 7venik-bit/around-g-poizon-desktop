name: Guard Naver inventory readiness
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/prepare-naver-stock-gate.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.head_ref == 'codex/naver-detail-stage-separation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Add delayed inventory boundary conditions
        shell: bash
        run: |
          mkdir -p naver-stock-gate-artifacts
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          let tests=readFileSync('tests/naver-detail-stage-separation.test.mjs','utf8');
          const once=(a,b)=>{assert.equal(tests.split(a).length,2);tests=tests.replace(a,b);};
          once('resolvedUrl = URL_PRODUCT, collectStock} = {})','resolvedUrl = URL_PRODUCT, collectStock, paintAfter = 0, laterHtml = ""} = {})');
          once('wait:async ms=>{now+=ms;}', 'wait:async ms=>{now+=ms;if(paintAfter && now>=paintAfter)for(const w of windows)if(!w.destroyed)w.dom.window.document.body.innerHTML=laterHtml;}');
          once("assert.equal(f.optionCalls(),1,'the actual option collector must still be attempted');", "assert.equal(f.optionCalls(),0,'unready inventory must not bypass the stock gate');\n  assert.ok(f.now()>=25000,'the separate stock gate must actually be observed');");
          once('const f=fixture(t,{collectStock:async({updates})=>{', "const f=fixture(t,{html:documentHtml('<button>구매하기</button>'),collectStock:async({updates})=>{");
          tests+=`\n
test('REGRESSION: an option loader cannot become complete inventory after identity succeeds',async t=>{
  const f=fixture(t,{html:documentHtml('<section aria-busy="true"><button>구매하기</button></section>'),collectStock:async()=>completeStock()});
  const r=await f.verify();
  assert.equal(r.products.length,1);
  assert.equal(r.products[0].price,149000);
  assert.equal(f.optionCalls(),0);
  assert.equal(recovery.stockObservationComplete(r.products[0]),false);
  assert.equal(r.products[0].inStock,null);
  assert.ok(f.updates.some(u=>u.products?.length),'identity checkpoint is retained while options stay pending');
});
test('REGRESSION: late inventory is collected only after the stock document becomes ready',async t=>{
  const f=fixture(t,{paintAfter:800,laterHtml:documentHtml('<button>구매하기</button>'),collectStock:async()=>completeStock()});
  const r=await f.verify();
  assert.ok(f.now()>=800&&f.now()<25000);
  assert.equal(f.optionCalls(),1);
  assert.equal(r.products.length,1);
  assert.equal(recovery.stockObservationComplete(r.products[0]),true);
  assert.equal(f.updates[0].products[0].stockVerified,false);
});
`;
          writeFileSync('tests/naver-detail-stage-separation.test.mjs',tests);
          NODE
          set +e
          node --test tests/naver-detail-stage-separation.test.mjs > naver-stock-gate-artifacts/before.tap 2>&1
          status=$?
          set -e
          cat naver-stock-gate-artifacts/before.tap
          test "$status" -ne 0
          test "$(grep -c '^not ok .*REGRESSION' naver-stock-gate-artifacts/before.tap)" -ge 2
      - name: Keep inventory readiness separate and mandatory
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          let source=readFileSync('main.mjs','utf8');
          const old='          const savedOptions = recoveryOptions[candidate.url];\n          optionStock = await collectRenderedProductStock(evidenceWindow,';
          const lines=[
            '          // Product identity does not bypass the original inventory gate.',
            '          // Open a collapsed menu, then wait for stock-bearing content.',
            '          // A stuck option loader leaves the checkpoint above intact.',
            '          if (!snapshot.ready) {',
            '            await openRenderedSizeOptions(evidenceWindow);',
            '            await waitForDomesticDetailReady(evidenceWindow, "네이버 패션타운", productUrl, generation, articleNumber);',
            '          }',
            '          const savedOptions = recoveryOptions[candidate.url];',
            '          optionStock = await collectRenderedProductStock(evidenceWindow,',
          ];
          assert.equal(source.split(old).length,2);
          source=source.replace(old,lines.join('\n'));
          writeFileSync('main.mjs',source);
          NODE
          node --check main.mjs
          git diff --check
          set -o pipefail
          node --test tests/naver-detail-stage-separation.test.mjs | tee naver-stock-gate-artifacts/after.tap
          git diff -- main.mjs tests/naver-detail-stage-separation.test.mjs > naver-stock-gate-artifacts/source.patch
      - name: Commit the guarded source and its tests to the feature branch only
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          test "$(git ls-remote origin refs/heads/codex/naver-detail-stage-separation | cut -f1)" = "$EXPECTED_HEAD"
          git add main.mjs tests/naver-detail-stage-separation.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: retain the stock readiness gate after Naver identity checkpoint'
          git push origin HEAD:refs/heads/codex/naver-detail-stage-separation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: naver-stock-readiness-boundaries
          path: naver-stock-gate-artifacts/
          retention-days: 7

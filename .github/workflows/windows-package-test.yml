name: Validate Windows package

# This workflow builds the same NSIS artifacts used by automatic updates.
on:
  pull_request:
    branches:
      - main
    paths:
      - "main.mjs"
      - "preload.cjs"
      - "src/**"
      - "services/**"
      - "relay/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/release.yml"
      - ".github/workflows/windows-package-test.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply SSG exact-result verdict restore
        run: node scripts/patch-ssg-verdict-restore.mjs

      - name: Verify SSG exact-result verdict
        run: node scripts/verify-ssg-verdict.mjs

      - name: Apply Lotte exact-result verdict restore
        run: node scripts/patch-lotte-verdict-restore.mjs

      - name: Verify Lotte exact-result verdict
        run: node scripts/verify-lotte-verdict.mjs

      - name: Apply SSG and Lotte authenticity guide
        run: node scripts/patch-domestic-authenticity-guide.mjs

      - name: Verify SSG and Lotte authenticity guide
        run: node scripts/verify-domestic-authenticity-guide.mjs

      - name: Apply deferred SSG search
        run: node scripts/patch-defer-ssg-search.mjs

      - name: Verify deferred SSG search
        run: node scripts/verify-defer-ssg-search.mjs

      - name: Apply SSG session reset on access limit
        run: node scripts/patch-ssg-session-reset.mjs

      - name: Verify SSG session reset on access limit
        run: node scripts/verify-ssg-session-reset.mjs

      - name: Apply simplified official and Naver search
        run: node scripts/patch-simplify-official-naver-search.mjs

      - name: Verify simplified official and Naver search
        run: node scripts/verify-simplify-official-naver-search.mjs

      - name: Apply Naver result-link finalizer
        run: node scripts/patch-naver-result-link-finalizer.mjs

      - name: Verify Naver result-link finalizer
        run: node scripts/verify-naver-result-link-finalizer.mjs

      - name: Apply next-day access cooldown
        run: node scripts/patch-domestic-access-next-day.mjs

      - name: Verify next-day access cooldown
        run: node scripts/verify-domestic-access-next-day.mjs

      - name: Close simplified search windows after result
        run: node scripts/patch-close-domestic-search-windows.mjs

      - name: Verify simplified search-window cleanup
        run: node scripts/verify-close-domestic-search-windows.mjs

      - name: Keep domestic results inside the controlled browser
        run: node scripts/patch-domestic-result-internal-window.mjs

      - name: Verify controlled domestic result window
        run: node scripts/verify-domestic-result-internal-window.mjs

      - name: Restore popular list auto login and capture
        run: node scripts/patch-restore-popular-login-capture.mjs

      - name: Verify popular list auto login and capture
        run: node scripts/verify-restore-popular-login-capture.mjs

      - name: Enable popular list automatic fetch on open
        run: node scripts/patch-popular-auto-fetch-on-open.mjs

      - name: Verify popular list automatic fetch on open
        run: node scripts/verify-popular-auto-fetch-on-open.mjs

      - name: Restore full popular ranking scroll capture
        run: node scripts/patch-popular-full-rank-scroll.mjs

      - name: Verify full popular ranking scroll capture
        run: node scripts/verify-popular-full-rank-scroll.mjs

      - name: Test retailer capture and completion with final patched source
        run: node --test tests/domestic-retailer-runtime.test.mjs tests/domestic-completion-lifecycle.test.mjs tests/retailer-stock-strategies.test.mjs tests/brand-official-search.test.mjs tests/domestic-recovery.test.mjs tests/store-save-recovery.test.mjs

      - name: Test stock collection in real Electron with pending page resources
        run: node scripts/test-electron-stock.mjs

      - name: Test local category search and explicit POIZON review separation
        run: node --test tests/category-excel-runtime.test.mjs tests/favorite-category-search-v2.10.294.test.mjs tests/live-poizon-crosscheck.test.mjs

      - name: Assign a distinct validation version
        id: candidate
        uses: actions/github-script@v7
        with:
          script: |
            const { data: release } = await github.rest.repos.getLatestRelease(context.repo);
            const match = /^v?(\d+)\.(\d+)\.(\d+)$/.exec(release.tag_name);
            if (!match) throw new Error(`Expected a stable release version, got ${release.tag_name}`);
            const version = `${match[1]}.${match[2]}.${Number(match[3]) + 1}-rc.${context.issue.number}.${context.runNumber}.${process.env.GITHUB_RUN_ATTEMPT}`;
            await exec.exec('npm', ['version', version, '--no-git-tag-version', '--ignore-scripts']);
            core.setOutput('version', version);
            core.info(`Validation installer: ${version}; stable release remains ${release.tag_name}`);

      - name: Build Windows installer
        run: npx electron-builder --win nsis --publish never

      - name: Verify package outputs
        shell: pwsh
        env:
          CANDIDATE_VERSION: ${{ steps.candidate.outputs.version }}
          CANDIDATE_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -ne $env:CANDIDATE_VERSION) {
            throw "Built package version does not match the validation version."
          }
          $installers = @(Get-ChildItem -Path dist -File -Filter "*.exe")
          $blockmaps = @(Get-ChildItem -Path dist -File -Filter "*.exe.blockmap")
          $updateInfo = Get-Item -Path "dist/latest.yml" -ErrorAction SilentlyContinue

          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)."
          }
          if ($blockmaps.Count -ne 1) {
            throw "Expected exactly one installer blockmap, found $($blockmaps.Count)."
          }
          if ($null -eq $updateInfo) {
            throw "dist/latest.yml was not generated."
          }

          $updateContent = Get-Content -LiteralPath $updateInfo.FullName -Raw
          if ($updateContent -notmatch "version:\s*$([regex]::Escape($version))") {
            throw "latest.yml does not contain version $version."
          }
          $installer = $installers[0]
          $manifest = [ordered]@{
            version = $version
            sourceCommit = $env:CANDIDATE_SOURCE_SHA
            buildCommit = $env:GITHUB_SHA
            runId = $env:GITHUB_RUN_ID
            installer = $installer.Name
            sizeBytes = $installer.Length
            sha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            validation = "Automated regression and Electron fixture checks passed; live retailer verification pending."
          }
          $manifest | ConvertTo-Json | Set-Content -LiteralPath "dist/validation-build.json" -Encoding utf8
          Write-Host "Windows validation installer and local update metadata were generated for $version."

      - name: Save validation installer
        uses: actions/upload-artifact@v4
        with:
          name: Around-G-POIZON-validation-${{ steps.candidate.outputs.version }}
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/validation-build.json
          if-no-files-found: error
          retention-days: 14

name: Validate Windows package

# This workflow builds the same NSIS artifacts used by automatic updates.
on:
  pull_request:
    branches:
      - main
    paths:
      - "main.mjs"
      - "preload.cjs"
      - "src/**"
      - "services/**"
      - "relay/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/release.yml"
      - ".github/workflows/windows-package-test.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply SSG exact-result verdict restore
        run: node scripts/patch-ssg-verdict-restore.mjs

      - name: Verify SSG exact-result verdict
        run: node scripts/verify-ssg-verdict.mjs

      - name: Apply Lotte exact-result verdict restore
        run: node scripts/patch-lotte-verdict-restore.mjs

      - name: Verify Lotte exact-result verdict
        run: node scripts/verify-lotte-verdict.mjs

      - name: Apply SSG and Lotte authenticity guide
        run: node scripts/patch-domestic-authenticity-guide.mjs

      - name: Verify SSG and Lotte authenticity guide
        run: node scripts/verify-domestic-authenticity-guide.mjs

      - name: Apply deferred SSG search
        run: node scripts/patch-defer-ssg-search.mjs

      - name: Verify deferred SSG search
        run: node scripts/verify-defer-ssg-search.mjs

      - name: Apply SSG session reset on access limit
        run: node scripts/patch-ssg-session-reset.mjs

      - name: Verify SSG session reset on access limit
        run: node scripts/verify-ssg-session-reset.mjs

      - name: Apply simplified official and Naver search
        run: node scripts/patch-simplify-official-naver-search.mjs

      - name: Verify simplified official and Naver search
        run: node scripts/verify-simplify-official-naver-search.mjs

      - name: Apply next-day access cooldown
        run: node scripts/patch-domestic-access-next-day.mjs

      - name: Verify next-day access cooldown
        run: node scripts/verify-domestic-access-next-day.mjs

      - name: Close simplified search windows after result
        run: node scripts/patch-close-domestic-search-windows.mjs

      - name: Verify simplified search-window cleanup
        run: node scripts/verify-close-domestic-search-windows.mjs

      - name: Keep domestic results inside the controlled browser
        run: node scripts/patch-domestic-result-internal-window.mjs

      - name: Verify controlled domestic result window
        run: node scripts/verify-domestic-result-internal-window.mjs

      - name: Restore popular list auto login and capture
        run: node scripts/patch-restore-popular-login-capture.mjs

      - name: Verify popular list auto login and capture
        run: node scripts/verify-restore-popular-login-capture.mjs

      - name: Enable popular list automatic fetch on open
        run: node scripts/patch-popular-auto-fetch-on-open.mjs

      - name: Verify popular list automatic fetch on open
        run: node scripts/verify-popular-auto-fetch-on-open.mjs

      - name: Restore full popular ranking scroll capture
        run: node scripts/patch-popular-full-rank-scroll.mjs

      - name: Verify full popular ranking scroll capture
        run: node scripts/verify-popular-full-rank-scroll.mjs

      - name: Build Windows installer
        run: npx electron-builder --win nsis --publish never

      - name: Verify package outputs
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installers = @(Get-ChildItem -Path dist -File -Filter "*.exe")
          $blockmaps = @(Get-ChildItem -Path dist -File -Filter "*.exe.blockmap")
          $latest = Get-Item -Path "dist/latest.yml" -ErrorAction SilentlyContinue

          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)."
          }
          if ($blockmaps.Count -ne 1) {
            throw "Expected exactly one installer blockmap, found $($blockmaps.Count)."
          }
          if ($null -eq $latest) {
            throw "dist/latest.yml was not generated."
          }

          $latestContent = Get-Content -LiteralPath $latest.FullName -Raw
          if ($latestContent -notmatch "version:\s*$([regex]::Escape($version))") {
            throw "latest.yml does not contain version $version."
          }
          Write-Host "Windows installer, blockmap, and latest.yml were generated for $version."

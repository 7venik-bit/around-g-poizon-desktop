name: Verify manual official-store audit
on:
  push:
    branches: [codex/favorite-brand-auto-link]
  pull_request:
    branches: [main]
    paths:
      - scripts/patch-domestic-authenticity-guide.mjs
      - scripts/verify-manual-official-audit.mjs
      - src/renderer.js
      - src/style.css
      - main.mjs
      - .github/workflows/favorite-brand-auto-link-test.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply shipping authenticity patch
        run: node scripts/patch-domestic-authenticity-guide.mjs
      - name: Verify manual-only official-store audit
        run: node scripts/verify-manual-official-audit.mjs
      - name: Verify final source syntax and official-domain policy
        run: node --check main.mjs && node --check src/renderer.js && node --test tests/official-domain-registry.test.mjs

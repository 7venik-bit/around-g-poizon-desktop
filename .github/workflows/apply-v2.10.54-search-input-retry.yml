name: Apply v2.10.54 search input retry fix

on:
  pull_request:
    branches:
      - main
    paths:
      - "hotfix/apply-v2.10.54-search-input-retry.py"
      - ".github/workflows/apply-v2.10.54-search-input-retry.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply source fix
        run: python hotfix/apply-v2.10.54-search-input-retry.py

      - name: Update frame-search regression check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/brand-export-completeness.test.mjs")
          source = path.read_text(encoding="utf-8")
          old = r'assert.match(workflow, /const searched = await sellerWindow\.webContents\.executeJavaScript/);'
          new = r'assert.match(workflow, /const runSellerSearch = \(targetFrame\) => targetFrame\.executeJavaScript/);'
          if old not in source:
              raise SystemExit("old single-frame assertion not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run complete tests
        run: npm test

      - name: Commit verified source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.mjs src/renderer.js package.json package-lock.json tests
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Release v2.10.54 fix seller search input retry"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

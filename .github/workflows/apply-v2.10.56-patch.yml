name: Apply v2.10.56 duplicate completion patch

on:
  push:
    branches:
      - agent/v2.10.56-fix-duplicate-completion
    paths:
      - scripts/apply-v2.10.56-patch.py
      - .github/workflows/apply-v2.10.56-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/v2.10.56-fix-duplicate-completion
          fetch-depth: 0

      - name: Apply source patch
        run: python scripts/apply-v2.10.56-patch.py

      - name: Remove temporary patch files
        run: |
          rm scripts/apply-v2.10.56-patch.py
          rm .github/workflows/apply-v2.10.56-patch.yml

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v2.10.56 prevent duplicate completion events"
          git push origin HEAD:agent/v2.10.56-fix-duplicate-completion

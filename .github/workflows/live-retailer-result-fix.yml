name: Verify live retailer price recovery
on:
  push:
    branches: [codex/live-retailer-result-fix]
    paths:
      - services/live-retailer-card-fallback.mjs
      - scripts/patch-simplify-official-naver-search.mjs
      - tests/live-retailer-card-fallback.test.mjs
      - scripts/live-retailer-program-audit.mjs
      - scripts/run-live-retailer-audit.cjs
      - .github/workflows/live-retailer-result-fix.yml
  pull_request:
    branches: [main]
    paths:
      - services/live-retailer-card-fallback.mjs
      - scripts/patch-simplify-official-naver-search.mjs
      - tests/live-retailer-card-fallback.test.mjs
permissions:
  contents: read
concurrency:
  group: live-retailer-result-fix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  live:
    runs-on: windows-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        scenario: [naver-jh9976, naver-crocs, official-crocs, lotte-crocs]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Unit-test visible retailer card recovery
        run: node --test tests/live-retailer-card-fallback.test.mjs
      - name: Apply the shipping release transformations in their actual order
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {spawnSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          const workflow=readFileSync('.github/workflows/release.yml','utf8');
          const scripts=[...workflow.matchAll(/^\s+run: node (scripts\/(?:patch|verify)-[a-z0-9-]+\.mjs)\s*$/gm)].map(m=>m[1]);
          assert.ok(scripts.length>20,'Shipping transformation list was not recognized');
          for(const script of scripts){
            const r=spawnSync(process.execPath,[script],{stdio:'inherit'});
            if(r.error)throw r.error;
            assert.equal(r.status,0,script);
          }
          NODE
      - name: Verify final runtime syntax
        run: node --check main.mjs && node --check relay/domestic-search.mjs && node --check services/official-domain-registry.mjs
      - name: Await actual program execution and require product-price evidence
        env:
          AROUNDG_LIVE_CASE: ${{ matrix.scenario }}
          AROUNDG_LIVE_OUTPUT: ${{ runner.temp }}/live-retailer-audit/${{ matrix.scenario }}
          AROUNDG_BASE_COMMIT: ${{ github.sha }}
        run: node scripts/run-live-retailer-audit.cjs
      - name: Preserve observed results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-program-fixed-${{ matrix.scenario }}
          path: ${{ runner.temp }}/live-retailer-audit/${{ matrix.scenario }}
          retention-days: 7
          if-no-files-found: error

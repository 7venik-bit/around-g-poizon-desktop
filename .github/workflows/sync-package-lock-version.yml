name: Sync package-lock release version

on:
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "hotfix/sync-package-lock-version.mjs"
      - ".github/workflows/sync-package-lock-version.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Synchronize package-lock version
        run: node hotfix/sync-package-lock-version.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Commit synchronized lock file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already synchronized."
          else
            git commit -m "Sync package-lock version to 2.10.50"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

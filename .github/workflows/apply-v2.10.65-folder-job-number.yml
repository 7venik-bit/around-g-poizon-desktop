name: Apply v2.10.65 folder job number

on:
  push:
    branches:
      - agent/v2.10.65-folder-job-number
    paths:
      - scripts/apply-v2.10.65-folder-job-number.py
      - .github/workflows/apply-v2.10.65-folder-job-number.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-v2.10.65-folder-job-number.py
      - .github/workflows/apply-v2.10.65-folder-job-number.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.head_ref == 'agent/v2.10.65-folder-job-number'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/v2.10.65-folder-job-number
          fetch-depth: 0

      - name: Apply source patch
        run: python scripts/apply-v2.10.65-folder-job-number.py

      - name: Remove temporary patch files
        run: |
          rm scripts/apply-v2.10.65-folder-job-number.py
          rm .github/workflows/apply-v2.10.65-folder-job-number.yml

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v2.10.65 add job number to brand folders"
          git push origin HEAD:agent/v2.10.65-folder-job-number

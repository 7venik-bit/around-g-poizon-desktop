name: Retailer readiness fix verification
on:
  push:
    branches: [codex/test-retailer-screenshot-regressions]
    paths: [.github/workflows/retailer-readiness-fix-once.yml]
permissions:
  contents: write
concurrency:
  group: retailer-readiness-fix-once
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == '7venik-bit/around-g-poizon-desktop' && github.ref == 'refs/heads/codex/test-retailer-screenshot-regressions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact reviewed substitutions to source, not install-time patches
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          def original(path, expected):
              data = Path(path).read_bytes()
              digest = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert digest == expected, f'{path} changed; inspect the new source before proceeding'
              return data.decode('utf-8')
          def once(text, old, new):
              assert text.count(old) == 1, f'Expected one exact source match: {old}'
              return text.replace(old, new, 1)
          main = original('main.mjs', '9602fbe1e5546493a38bc3808f19d12e5c0aeb16')
          start = main.index('async function loadMusinsaResultPage(')
          end = main.index('\nasync function renderedSearchSourceResult(', start)
          block = main[start:end]
          block = once(block,
              '  const expectedQuery = sanitizeDomesticProductCode(query) || sanitizeDomesticQuery(query);',
              '  // A fallback title is a phrase, not an article code. Keep its word boundaries.\n  const expectedQuery = sanitizeDomesticQuery(query);')
          block = once(block,
              '''      const expected = ${JSON.stringify(expectedQuery)};
                const actual = String(current.searchParams.get("keyword") || "").trim();'''.replace('\n      ', '\n'),
              r'''      const normalizeQuery = value => String(value || "").replace(/\\s+/g, " ").trim().toUpperCase();
                const expected = normalizeQuery(${JSON.stringify(expectedQuery)});
                const actual = normalizeQuery(current.searchParams.get("keyword"));'''.replace('\n      ', '\n'))
          block = once(block,
              '&& actual.toUpperCase() === expected.toUpperCase();',
              '&& expected.length > 0 && actual === expected;')
          Path('main.mjs').write_text(main[:start] + block + main[end:], encoding='utf-8')
          detail = original('services/domestic-detail-page.mjs', '8129e05f16e60d87f8f4111d16f36c25bc582e64')
          old = '''  const busy = [...document.querySelectorAll('[aria-busy="true"],[role="progressbar"]')].some(visible);'''
          new = r'''  // Ignore only explicitly identified recommendation/advertisement regions.
            // A purchase panel can live in an aside; do not discard all sidebars
            // or restrict readiness to main. Unclassified/global loaders still block.
            const unrelatedLoadingRegion = element => {
              for (let node = element; node && node !== document.body && node !== document.documentElement; node = node.parentElement) {
                if (node.matches('main,[role="main"]')) break;
                const labels = ['id', 'class', 'aria-label', 'data-testid'].map(key => node.getAttribute(key) || '').join(' ');
                if (/recommend|related[-_ ]?(?:product|goods)|advert(?:isement|ising)?|(?:^|[\s_-])ads?(?:$|[\s_-])|추천|광고/i.test(labels)) return true;
              }
              return false;
            };
            const visibleLoading = element => {
              if (!visible(element)) return false;
              // A child can have dimensions in a synthetic/cached layout even
              // though a containing widget is hidden. Check its ancestors too.
              for (let node = element; node; node = node.parentElement) {
                const style = getComputedStyle(node);
                if (node.hidden || node.getAttribute('aria-hidden') === 'true'
                  || style.display === 'none' || style.visibility === 'hidden') return false;
              }
              return true;
            };
            const busy = [...document.querySelectorAll('[aria-busy="true"],[role="progressbar"]')]
              .some(element => visibleLoading(element) && !unrelatedLoadingRegion(element));'''.replace('\n          ', '\n')
          # Remove this YAML/Python block's six extra visual indentation spaces.
          new = new.splitlines()[0] + '\n' + '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines()[1:]) if False else new
          # The Python block above has ten formatting spaces beyond the source indent.
          lines = new.splitlines()
          new = lines[0] + '\n' + '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[1:])
          Path('services/domestic-detail-page.mjs').write_text(once(detail, old, new), encoding='utf-8')
      - name: Syntax and diff checks
        run: |
          node --check main.mjs
          node --check services/domestic-detail-page.mjs
          git diff --check
          git diff --stat
      - name: Install dependencies without running the full suite before focused tests
        run: |
          npm ci --ignore-scripts > /tmp/retailer-install.log 2>&1 || { tail -n 60 /tmp/retailer-install.log; exit 1; }
      - name: Run original 19 regressions and added boundary tests first
        run: |
          node --test tests/retailer-screenshot-regressions.test.mjs tests/retailer-readiness-boundaries.test.mjs > /tmp/retailer-focused.log 2>&1 || { cat /tmp/retailer-focused.log; exit 1; }
          tail -n 12 /tmp/retailer-focused.log
      - name: Run mandatory installation verification
        run: |
          npm run postinstall > /tmp/retailer-postinstall.log 2>&1 || { tail -n 160 /tmp/retailer-postinstall.log; exit 1; }
          tail -n 12 /tmp/retailer-postinstall.log
      - name: Run full source suite
        run: |
          npm test > /tmp/retailer-full.log 2>&1 || { tail -n 160 /tmp/retailer-full.log; exit 1; }
          tail -n 12 /tmp/retailer-full.log
      - name: Show the exact tested source diff
        run: git diff -- main.mjs services/domestic-detail-page.mjs
      - name: Store tested source blobs only; do not update branches, merge, tag or release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, urllib.request
          from pathlib import Path
          repo = '7venik-bit/around-g-poizon-desktop'
          for path in ['main.mjs', 'services/domestic-detail-page.mjs']:
              payload = json.dumps({'content': Path(path).read_text(encoding='utf-8'), 'encoding': 'utf-8'}).encode()
              request = urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs', data=payload,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request) as response:
                  blob = json.load(response)
              print(json.dumps({'tested_path': path, 'blob_sha': blob['sha']}))

name: Diagnose v2.10.56 tests

on:
  push:
    branches:
      - agent/v2.10.56-fix-duplicate-completion
    paths:
      - .github/workflows/diagnose-v2.10.56-tests.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/v2.10.56-fix-duplicate-completion
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture test output
        shell: bash
        run: |
          set +e
          npm test > ci-v2.10.56-test-output.txt 2>&1
          code=$?
          printf '%s\n' "$code" > ci-v2.10.56-test-exit.txt
          exit 0

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-v2.10.56-test-output.txt ci-v2.10.56-test-exit.txt
          git commit -m "Capture v2.10.56 test diagnostics"
          git push origin HEAD:agent/v2.10.56-fix-duplicate-completion

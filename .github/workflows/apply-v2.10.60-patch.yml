name: Apply v2.10.60 separate monitor window patch

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/patch-v2.10.60.py
      - .github/workflows/apply-v2.10.60-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/v2.10.60-separate-monitor-window
          fetch-depth: 0

      - name: Correct current HTML matcher
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('scripts/patch-v2.10.60.py')
          source = path.read_text(encoding='utf-8')
          replacement = '''html, html_insert_count = re.subn(
              r'(?m)^(?P<indent>\\s*)<div id="brand-export-job" class="brand-export-job" hidden>',
              lambda match: (
                  f'{match.group("indent")}<section id="brand-batch-progress" class="brand-batch-progress" hidden aria-live="polite">\\n'
                  f'{match.group("indent")}  <div class="brand-batch-progress-head"><strong>복수 브랜드 진행 현황</strong><span id="brand-batch-summary"></span></div>\\n'
                  f'{match.group("indent")}  <div id="brand-batch-list" class="brand-batch-list"></div>\\n'
                  f'{match.group("indent")}</section>\\n'
                  f'{match.group("indent")}<div id="brand-export-job" class="brand-export-job" hidden>'
              ),
              html,
              count=1,
          )
          if html_insert_count != 1:
              raise RuntimeError(f"batch progress html: expected one structural match, found {html_insert_count}")'''
          source, count = re.subn(
              r'html = replace_once\([\s\S]*?"batch progress html",\n\)',
              replacement,
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'HTML patch section not found: {count}')
          path.write_text(source, encoding='utf-8')
          PY

      - name: Apply source patch
        run: python scripts/patch-v2.10.60.py

      - name: Remove temporary patch files
        run: |
          rm scripts/patch-v2.10.60.py
          rm .github/workflows/apply-v2.10.60-patch.yml

      - name: Commit v2.10.60 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v2.10.60 separate registration and monitor windows"
          git push origin HEAD:agent/v2.10.60-separate-monitor-window

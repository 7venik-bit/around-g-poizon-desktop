name: Apply v2.10.60 separate monitor window patch

on:
  push:
    branches:
      - agent/v2.10.60-separate-monitor-window
    paths:
      - scripts/patch-v2.10.60.py
      - .github/workflows/apply-v2.10.60-patch.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/patch-v2.10.60.py
      - .github/workflows/apply-v2.10.60-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/v2.10.60-separate-monitor-window
          fetch-depth: 0

      - name: Apply source patch
        run: python scripts/patch-v2.10.60.py

      - name: Remove temporary patch files
        run: |
          rm scripts/patch-v2.10.60.py
          rm .github/workflows/apply-v2.10.60-patch.yml

      - name: Commit v2.10.60 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v2.10.60 separate registration and monitor windows"
          git push origin HEAD:agent/v2.10.60-separate-monitor-window

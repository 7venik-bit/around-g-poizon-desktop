name: Apply v2.10.57 monitor recovery patch

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/patch-v2.10.57.py
      - .github/workflows/apply-v2.10.57-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/v2.10.57-monitor-recovery-completed-list
          fetch-depth: 0

      - name: Correct patch matchers
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/patch-v2.10.57.py")
          source = path.read_text(encoding="utf-8")
          source = source.replace(
              "'''      ipcMain.handle(\"seller:start-brand-export-monitor\", () => {\n        void watchAllSellerExportJobsEveryTenSeconds();\n        return { ok: true, jobs: brandExportJobs.size };\n      });''',",
              "'''ipcMain.handle(\"seller:start-brand-export-monitor\", () => {\n    void watchAllSellerExportJobsEveryTenSeconds();\n    return { ok: true, jobs: brandExportJobs.size };\n  });''',",
          )
          source = source.replace(
              "'''      ipcMain.handle(\"seller:start-brand-export-monitor\", () => {\n        scheduleBrandExportMonitor(0);\n        return { ok: true, jobs: brandExportJobs.size };\n      });''',",
              "'''ipcMain.handle(\"seller:start-brand-export-monitor\", () => {\n    scheduleBrandExportMonitor(0);\n    return { ok: true, jobs: brandExportJobs.size };\n  });''',",
          )
          source = source.replace(
              '    if count != 1:\n        raise RuntimeError(f"{path}: expected exactly one match, found {count}")',
              '    if count < 1:\n        raise RuntimeError(f"{path}: expected at least one match, found {count}")',
          )
          path.write_text(source, encoding="utf-8")
          PY

      - name: Apply patch
        run: python scripts/patch-v2.10.57.py

      - name: Remove temporary patch files
        run: |
          rm scripts/patch-v2.10.57.py
          rm .github/workflows/apply-v2.10.57-patch.yml

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v2.10.57 recover monitor and list completed jobs"
          git push origin HEAD:agent/v2.10.57-monitor-recovery-completed-list

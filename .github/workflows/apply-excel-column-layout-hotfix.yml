name: Apply Excel column layout hotfix

on:
  push:
    branches:
      - main
    paths:
      - "hotfix/apply_excel_column_layout.py"

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply hotfix
        run: python hotfix/apply_excel_column_layout.py

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Commit verified release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.mjs preload.cjs package.json package-lock.json services src tests
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Release v2.10.44 Excel column layout"
          git push origin HEAD:main

      - name: Start Windows release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main

name: Apply v2.10.61 hidden popular capture patch

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/patch-v2.10.61.py
      - .github/workflows/apply-v2.10.61-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/v2.10.61-hide-popular-window
          fetch-depth: 0

      - name: Apply source patch
        run: python scripts/patch-v2.10.61.py

      - name: Remove temporary patch files
        run: |
          rm scripts/patch-v2.10.61.py
          rm .github/workflows/apply-v2.10.61-patch.yml

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v2.10.61 hide popular-product Seller Center window"
          git push origin HEAD:agent/v2.10.61-hide-popular-window

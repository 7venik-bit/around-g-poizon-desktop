name: Apply v2.10.51 export confirmation fix

on:
  pull_request:
    branches:
      - main
    paths:
      - "hotfix/apply-v2.10.51-export-confirmation.py"
      - ".github/workflows/apply-v2.10.51-export-confirmation.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply fix
        run: python hotfix/apply-v2.10.51-export-confirmation.py

      - name: Install dependencies
        run: npm ci

      - name: Capture complete test result
        shell: bash
        run: |
          set +e
          npm test > ci-v2.10.51-test-output.txt 2>&1
          TEST_EXIT=$?
          echo "$TEST_EXIT" > ci-v2.10.51-test-exit.txt
          cat ci-v2.10.51-test-output.txt
          exit 0

      - name: Commit patched source and diagnostic report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.mjs src/renderer.js package.json package-lock.json \
            tests/brand-export-recovery.test.mjs \
            tests/search-service-menu.test.mjs \
            tests/release-delivery.test.mjs \
            tests/export-job-registration-v2.10.51.test.mjs \
            ci-v2.10.51-test-output.txt ci-v2.10.51-test-exit.txt
          if git diff --cached --quiet; then
            echo "No source or diagnostic changes to commit."
          else
            git commit -m "Diagnose v2.10.51 export registration tests"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

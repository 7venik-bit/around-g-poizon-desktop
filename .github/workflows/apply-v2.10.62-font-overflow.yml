name: Apply v2.10.62 typography patch

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/patch-v2.10.62.py
      - .github/workflows/apply-v2.10.62-font-overflow.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/v2.10.62-font-overflow
          fetch-depth: 0

      - name: Apply responsive typography patch
        run: python scripts/patch-v2.10.62.py

      - name: Remove temporary patch files
        run: |
          rm scripts/patch-v2.10.62.py
          rm .github/workflows/apply-v2.10.62-font-overflow.yml

      - name: Commit v2.10.62 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v2.10.62 prevent clipped interface text"
          git push origin HEAD:agent/v2.10.62-font-overflow

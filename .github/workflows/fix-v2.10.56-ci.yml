name: Fix v2.10.56 duplicate completion CI

on:
  push:
    branches:
      - agent/v2.10.56-fix-duplicate-completion
    paths:
      - scripts/fix-v2.10.56-ci.py
      - .github/workflows/fix-v2.10.56-ci.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/v2.10.56-fix-duplicate-completion
          fetch-depth: 0

      - name: Apply correction
        run: python scripts/fix-v2.10.56-ci.py

      - name: Remove temporary patch files
        run: |
          rm scripts/fix-v2.10.56-ci.py
          rm .github/workflows/fix-v2.10.56-ci.yml

      - name: Commit corrected source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix v2.10.56 completion count and regression scope"
          git push origin HEAD:agent/v2.10.56-fix-duplicate-completion
